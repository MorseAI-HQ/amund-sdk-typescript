# Standalone template; install under .github/workflows/ only after review.
name: SDK — independent validation
on:
  pull_request:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned scanner
        run: |
          case "$(uname -m)" in
            aarch64|arm64) GL_ARCH=arm64 ;;
            x86_64) GL_ARCH=x64 ;;
            *) exit 1 ;;
          esac
          curl --fail -sSL --retry 5 --retry-all-errors --connect-timeout 15 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          mkdir -p /tmp/morse-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/morse-gitleaks gitleaks
      - name: Scan complete repository history
        run: /tmp/morse-gitleaks/gitleaks git . --config .gitleaks.toml --redact --log-opts="--all"
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install locked dependencies and native test bindings
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @morsehq/sdk type-check
      - name: Lint
        run: pnpm --filter @morsehq/sdk lint
      - name: Test serially with original timeouts
        run: pnpm --filter @morsehq/sdk exec vitest run --maxWorkers=1
      - name: Build
        run: pnpm --filter @morsehq/sdk build
      - name: Check browser bundle
        run: node scripts/check-sdk-browser-bundle.mjs
      - name: Inspect package contents without publishing
        working-directory: apps/sdk/typescript
        run: npm pack --dry-run

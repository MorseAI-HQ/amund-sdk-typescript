# Standalone template; install under .github/workflows/ only after review.
name: SDK — independent validation
on:
  pull_request:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned SHA-256)
        # Verified against a checksum pinned here, not one fetched alongside the binary.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan complete repository history
        run: gitleaks git . --config .gitleaks.toml --redact --log-opts="--all"
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install locked dependencies and native test bindings
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @morsehq/sdk type-check
      - name: Lint
        run: pnpm --filter @morsehq/sdk lint
      - name: Test serially with original timeouts
        run: pnpm --filter @morsehq/sdk exec vitest run --maxWorkers=1
      - name: Build
        run: pnpm --filter @morsehq/sdk build
      - name: Check browser bundle
        run: node scripts/check-sdk-browser-bundle.mjs
      - name: Inspect package contents without publishing
        working-directory: apps/sdk/typescript
        run: npm pack --dry-run
